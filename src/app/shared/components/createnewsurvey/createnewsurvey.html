<div class="mainbubble">
    <div class="mainbubble__positioning">
        <div class="draft">
            <div class="draft__bubble">
                <p>Draft</p>
            </div>
        </div>
        <div class="createnewsurveytext">
            <p>Create new survey</p>
            <div class="cancelbutton">
                <p>Cancel</p>
                <img src="/assets/close.svg">
            </div>
        </div>

        <form [formGroup]="survey">
            <div class="formsbubble">
                <div class="formsbubble__top">
                    <div class="formsbubble__leftside">
                        <div class="surveynameform">
                            <div class="surveynameform__text">
                                <p>Survey name</p>
                            </div>
                            <div class="surveynameform__input">
                                <input formControlName="survey_name">
                                <div class="delete-icon">
                                    <img src="/assets/delete.svg">
                                </div>
                            </div>
                        </div>
                        <div class="surveyenddate">
                            <div class="surveyenddate__text">
                                <div class="surveyenddate__text--date">
                                    <p>Set end date <span>(optional)</span></p>
                                    <div class="surveyenddate__input">
                                        <input formControlName="end_date">
                                        <div class="delete-icon">
                                            <img src="/assets/delete.svg">
                                        </div>
                                    </div>
                                </div>
                                <div class="surveyenddate__text--category" (click)="toggleMenu()">
                                    <div class="surveyenddate__text--arrow">
                                        <p>Choose category</p>
                                        @if(menuOpen){
                                        <span>▲</span>
                                        }@else{
                                        <span>▼</span>
                                        }
                                    </div>
                                    @if(menuOpen){
                                    <div class="dropdowncategorymenu">
                                        @for(category of categories; track category){
                                        <p (click)="$event.stopPropagation(); chooseCategory(category)">
                                            {{ category }}
                                        </p>
                                        }
                                    </div>}
                                    <h3 class="surveyenddate__text--choosencategory">{{category}}</h3>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="formsbubblerightside">
                        <div class="formsbubblerightside__text">
                            <p>Describing text <span>(optional)</span></p>
                        </div>
                        <div class="formsbubblerightside__input">
                            <input formControlName="description">
                            <div class="delete-icon">
                                <img src="/assets/delete.svg">
                            </div>
                        </div>

                        <div class="formsbubblerightside__button" (click)="addQuestion()">
                            <p>Add next question</p>
                            <img src="/assets/add_circle.svg">
                        </div>
                    </div>
                </div>
                <app-questions [surveyForm]="survey"></app-questions>
            </div>
        </form>
        <div class="publishbutton">
            <p>Publish</p>
            <img src="/assets/check.svg">
        </div>
    </div>
</div>
